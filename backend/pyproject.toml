[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melody-scribe-backend"
version = "0.1.0"
description = "Backend for MelodyScribe melody recognition app"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.9",
    "pydantic==2.7.0",
    "librosa==0.10.2",
    "numpy==1.26.4",
    "music21==9.1.0",
    "pydub==0.25.1"
]
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest", "black", "isort"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]