<!-- @dsCard group="Editor — Tablet/Desktop" name="Редактор (iPad)" subtitle="3 такти/рядок, summary-чіп, картка редагування" width="834" -->
<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editor — iPad 834</title><style>
  :root{
    --paper:#FAF6EF; --paper-dark:#F3EDE2; --ink:#2B2A26; --ink-soft:#6B675E;
    --surface:#FFFFFF; --sheet:#FFFFFF; --accent:#7C5CBF; --accent-hover:#6A4BAD;
    --valid:#4C8C6A; --warn:#C98A2D; --danger:#B4533F; --staff:#3D3A33;
    --page-bg:#E9E4D9; --frame-shadow:0 8px 40px rgba(43,42,38,.18);
    color-scheme:light;
  }
  .dark{
    --paper:#1E1C19; --paper-dark:#2A2723; --ink:#E8E4DC; --ink-soft:#9E988C;
    --surface:#302D28; --sheet:#F6F2E9;
    --page-bg:#121110; --frame-shadow:0 8px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--page-bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);padding:48px 16px 80px;transition:background .2s}
  h1,h2,h3,.font-heading{font-family:Georgia,"Times New Roman",serif}

  /* ── component classes (mirror .btn-* from index.css, new sizes) ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border-radius:6px;font-size:14px;font-weight:500;border:1px solid transparent;
    cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;
    text-decoration:none;background:none;font-family:inherit;color:inherit}
  .btn-primary{background:var(--accent);color:#fff;padding:0 16px;min-height:36px}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-secondary{background:var(--surface);color:var(--ink);padding:0 16px;min-height:36px;
    border-color:color-mix(in srgb,var(--ink-soft) 30%,transparent)}
  .btn-secondary:hover{background:var(--paper-dark)}
  .btn-ghost{color:var(--ink-soft);padding:0 12px;min-height:32px}
  .btn-ghost:hover{background:var(--paper-dark);color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-danger-outline{background:var(--surface);color:var(--danger);padding:0 16px;min-height:36px;
    border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
  .input-field{border-radius:6px;background:var(--surface);color:var(--ink);
    border:1px solid color-mix(in srgb,var(--ink-soft) 30%,transparent);
    padding:0 12px;min-height:36px;font-size:14px;font-family:inherit;width:100%}
  .card{border-radius:8px;background:var(--surface);padding:16px;
    border:1px solid color-mix(in srgb,var(--ink-soft) 15%,transparent);
    box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .chip{display:inline-flex;align-items:center;border-radius:999px;font-size:12px;
    color:var(--ink-soft);padding:3px 10px;white-space:nowrap;
    border:1px solid color-mix(in srgb,var(--ink-soft) 20%,transparent);
    background:color-mix(in srgb,var(--surface) 60%,transparent)}

  /* touch mode: emulates @media(pointer:coarse) — 44px floor everywhere */
  .touch .btn-primary,.touch .btn-secondary,.touch .btn-danger-outline{min-height:44px;min-width:44px;padding:0 16px}
  .touch .btn-ghost{min-height:44px;min-width:44px;padding:0 12px}
  .touch .input-field{min-height:44px}
  .touch .chip.tappable{min-height:44px;padding:0 14px;font-size:13px}

  /* segmented control */
  .seg{display:inline-flex;background:var(--paper-dark);border-radius:8px;padding:3px;gap:2px}
  .seg .btn{min-height:30px;padding:0 12px;border-radius:6px;color:var(--ink-soft)}
  .touch .seg .btn{min-height:38px}
  .seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .seg .on.acc{background:var(--accent);color:#fff}

  /* device frame */
  .stage{display:flex;flex-direction:column;align-items:center;gap:12px}
  .frame{background:var(--paper);border-radius:18px;overflow:hidden;position:relative;
    box-shadow:var(--frame-shadow);display:flex;flex-direction:column;flex:none}
  .frame-label{font-size:12px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase}
  .caption{font-size:13px;color:var(--ink-soft);max-width:640px;text-align:center;line-height:1.5}

  /* app chrome inside frames */
  .appbar{background:color-mix(in srgb,var(--paper-dark) 95%,transparent);
    border-bottom:1px solid color-mix(in srgb,var(--ink-soft) 15%,transparent);flex:none}
  .brand{font-family:Georgia,serif;font-weight:700;color:var(--ink)}
  .bottombar{background:color-mix(in srgb,var(--paper-dark) 97%,transparent);
    border-top:1px solid color-mix(in srgb,var(--ink-soft) 15%,transparent);flex:none;position:relative;z-index:5}
  .safe-area{height:22px;flex:none;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb,var(--paper-dark) 97%,transparent)}
  .safe-area i{display:block;width:120px;height:5px;border-radius:3px;background:var(--ink-soft);opacity:.45}

  /* sheet of music */
  .sheet{background:var(--sheet);border-radius:8px;
    border:1px solid color-mix(in srgb,var(--ink-soft) 18%,transparent);
    box-shadow:0 1px 3px rgba(0,0,0,.07)}
  .dark .sheet{box-shadow:0 3px 14px rgba(0,0,0,.5)}
  .sheet svg{display:block;width:100%;height:auto}

  /* bottom sheet + scrim */
  .scrim{position:absolute;inset:0;background:rgba(20,18,15,.35);z-index:10}
  .bsheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:var(--surface);
    border-radius:16px 16px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25);padding:8px 16px 0}
  .bsheet .grab{width:36px;height:4px;border-radius:2px;background:var(--ink-soft);
    opacity:.35;margin:4px auto 10px}
  .sheet-row{display:flex;align-items:center;gap:14px;min-height:48px;width:100%;
    font-size:15px;color:var(--ink);border-radius:8px;padding:0 8px;cursor:pointer;
    background:none;border:none;font-family:inherit;text-align:left}
  .sheet-row:hover{background:var(--paper-dark)}
  .sheet-row .ic{width:24px;text-align:center;flex:none}

  /* stepper */
  .stepper{display:inline-flex;align-items:center;gap:8px}
  .stepper .btn{font-size:18px;font-weight:600}

  /* toasts */
  .toast{display:flex;align-items:center;gap:10px;border-radius:10px;padding:12px 14px;
    background:var(--surface);color:var(--ink);font-size:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);border-left:4px solid var(--valid)}
  .toast.danger{border-left-color:var(--danger)}
  .field-error{color:var(--danger);font-size:12px;margin-top:4px}

  .note-name{font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--ink)}
  .kbd{font-family:ui-monospace,monospace;font-size:11px;background:var(--paper-dark);
    border:1px solid color-mix(in srgb,var(--ink-soft) 25%,transparent);
    border-radius:4px;padding:1px 5px;color:var(--ink-soft)}
  a{color:var(--accent)}
</style></head>
